services:
  neo4j:
    image: neo4j:5-community
    container_name: polytone-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # first start only: Neo4j keeps the password in its volume afterwards (rotate it with
      # scripts/rotate-neo4j-password.sh, which updates .env). Compose reads NEO4J_PASSWORD from .env.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-polytone-local}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - polytone_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  polytone_neo4j_data:
