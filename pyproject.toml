[project]
name = "polytone-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "langgraph>=0.2",
  "neo4j>=5.20",
  "mcp>=1.2",
  "httpx>=0.27",
  "websockets>=12",
  "watchdog>=4",
  "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.2"]
gmail = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
polytone-api = "backend.daemon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["neo4j: requires the local Neo4j container"]
asyncio_default_fixture_loop_scope = "function"
